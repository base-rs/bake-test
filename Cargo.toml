[package]
name = "bake-test"
version = "0.3.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/base-rs/bake-test"
description = "Reusable Rust test tasks for Bake"
readme = "readme.md"
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["bake"]
resolver = "3"

[workspace.metadata.bake]
manifest = "bake/Cargo.toml"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[patch.crates-io]
bake-test = { path = "." }

[lib]
name = "bake_test"

[dependencies]
bake = "0"
serde_json = "1.0"
toml_edit = "0.25"
